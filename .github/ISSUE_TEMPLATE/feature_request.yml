name: Feature request
description: Propose a focused improvement to APS.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the playback scenario that APS does not handle well.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired behavior and any alternatives you have tried.
    validations:
      required: true
